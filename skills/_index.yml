note: >-
  These are NOT authored by API Evangelist. Amboras ships a set of agent operating
  instructions inside every storefront it provisions - storefront/CLAUDE.md plus a
  storefront/.claude/ directory of seven task-scoped instruction files - and those
  repositories are public under the github.com/Amboras organization (458 public
  storefront repos as of 2026-08-13). The files were confirmed byte-identical across
  three independently provisioned stores (store-my-store-ju0t, -n3z4, -orvm; md5
  e7ea1b8108c4680affe283031224bcd8 for products.md in all three), which establishes
  them as Amboras template content rather than one merchant's local notes. They are
  saved here VERBATIM. They are written for a coding agent editing a Next.js
  storefront against the Amboras-operated Medusa v2 backend, not as callable API
  workflows, so operations are named as Medusa JS SDK calls and storefront file paths
  rather than OpenAPI operationIds - Amboras publishes no OpenAPI to ground those in.
