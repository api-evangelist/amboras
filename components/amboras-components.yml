note: 'Amboras ships a client-side extension surface for its AI-built Next.js storefronts: a named SLOT
  system plus a family of npm packages that render into those slots. This is distinct from an SDK - the
  packages are React components and hooks mounted at fixed storefront positions, not a client library
  for calling an API. The slot registry below is the REAL published contract, read verbatim from the compiled
  SLOT_DISPLAY_NAMES export inside the @amboras-dev/plugin-types@1.1.0 tarball downloaded from the npm
  registry on 2026-08-13, not reconstructed from prose. The package description states its purpose plainly:
  "Shared slot names and base types for the Amboras plugin slot system", and the doc comment states the
  slots are "Used by the admin placement picker to show slot options in plain language. Only visible (non-invisible)
  slots should be presented as placement choices." No public developer guide explains how a third party
  would author against these slots - amboras.com has no /docs, /developers or /api page (all 404) - so
  the contract is published but undocumented.'
