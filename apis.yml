apis:
- name: Amboras Storefront Backend
  description: >-
    The multi-tenant commerce backend Amboras operates at api.amboras.com. Every
    Amboras-built storefront calls it through the Medusa JS SDK, sending a
    publishable API key (x-publishable-api-key, pk_ prefix) plus an
    X-Store-Environment-ID header that routes the query to that merchant's store
    database - Amboras's own storefront template README describes it as the
    "shared Medusa Backend Orchestrator". The contract shape is upstream Medusa
    v2 (/store/* and /admin/*); Amboras publishes no OpenAPI of its own, so no
    spec is captured here. Amboras layers its own endpoints on top:
    /store/product-extensions/products/{id}/variants for compare-at prices,
    /store/analytics/events for first-party analytics ingest, and
    /store/stripe-connect. GET /health returns {"status":"ok"} anonymously; every
    other probed path returns 400 (publishable key required) or 401.
  humanURL: https://github.com/Amboras
  baseURL: https://api.amboras.com
