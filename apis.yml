name: Amboras
description: >-
  Amboras is an AI-native e-commerce platform - positioned as "the AI-native
  Shopify" - that puts an entire online store on autopilot. Merchants build or
  rebuild a storefront by talking to AI in natural language, and Amboras then
  autonomously generates design, copy, and product imagery, runs generative A/B
  tests, adjusts pricing and offers, and reads first-party analytics to
  continuously optimize conversion rate, retention, and average order value.
  It includes integrated checkout via Stripe and PayPal and first-party
  session, funnel, and revenue tracking with no third-party pixels. Founded in
  2025 in San Francisco by Imad and Amin Mokadem, Amboras is a Y Combinator
  Spring 2026 (P26) company. As of this profile the company publishes no public
  developer API, SDK, or API documentation - this record captures its public
  web and product surface only.
