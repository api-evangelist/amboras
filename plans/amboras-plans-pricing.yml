  no metered API quota and no developer tier - the units sold are stores, team seats, custom
  domains and "AI usage", expressed as a multiple of the entry tier rather than an absolute
  number. Read verbatim from the public pricing page on 2026-08-13. Note the page is
  internally inconsistent: the plan cards name the entry tier "Basic", while the FAQ block on
  the same page still calls it "Launch" ("What's the difference between Launch and Grow?",
  "30-day launch guarantee on Launch, Grow & Advanced") - captured as published rather than
  reconciled. The 2026-05-26 changelog entry "No more trial" records that new stores no
  longer get a trial and pick a plan up front, which matches the trial: false already
  recorded in accessModel.
